<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慢食光·工作台</title>
  <link rel="shortcut icon" href="favicon.ico">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="plugins/element-ui/index.css" />
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/icon/iconfont.css" />
  <style>
    .body{
      min-width: 1366px;
    }
    .app-main{
      height: calc(100% - 64px);
    }
    .app-main .divTmp{
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="app-wrapper openSidebar clearfix">
      <!-- sidebar -->
      <div class="sidebar-container">
        <div class="logo">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <span class="brand-text">慢食光·工作台</span>
        </div>

        <el-scrollbar wrap-class="scrollbar-wrapper">
          <el-menu
            :default-active="defAct"
            :unique-opened="false"
            :collapse-transition="false"
            background-color="#faf8f5"
            text-color="#6b635a"
            active-text-color="#c8a97e"
            router="false"
          >
            <el-menu-item index="2" @click="menuHandle({id:'2', name:'员工管理', url:'page/member/list.html', icon:'icon-member'}, false)">
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <span>员工管理</span>
            </el-menu-item>
            <el-menu-item index="3" @click="menuHandle({id:'3', name:'分类管理', url:'page/category/list.html', icon:'icon-category'}, false)">
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12h16"/>
                <path d="M4 6h16"/>
                <path d="M4 18h16"/>
                <path d="M12 6v12"/>
              </svg>
              <span>分类管理</span>
            </el-menu-item>
            <el-menu-item index="4" @click="menuHandle({id:'4', name:'菜品管理', url:'page/food/list.html', icon:'icon-food'}, false)">
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <path d="M12 6v6l4 2"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
              <span>菜品管理</span>
            </el-menu-item>
            <el-menu-item index="5" @click="menuHandle({id:'5', name:'套餐管理', url:'page/combo/list.html', icon:'icon-combo'}, false)">
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
              <span>套餐管理</span>
            </el-menu-item>
            <el-menu-item index="6" @click="menuHandle({id:'6', name:'订单管理', url:'page/order/list.html', icon:'icon-order'}, false)">
              <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <span>订单管理</span>
            </el-menu-item>
          </el-menu>
        </el-scrollbar>
      </div>
      <div class="main-container">
        <div class="navbar">
          <div class="head-lable">
            <span v-if="goBackFlag" class="goBack" @click="goBack()"
              ><img src="images/icons/btn_back@2x.png" alt="" /> 返回</span
            >
            <span>{{headTitle}}</span>
          </div>
          <div class="right-menu">
            <div class="avatar-wrapper">{{ userInfo.name }}</div>
            <img src="images/icons/btn_close@2x.png" class="outLogin" alt="退出" @click="logout" />
          </div>
        </div>
        <div class="app-main" v-loading="loading">
          <div class="divTmp" v-show="loading"></div>
          <iframe
            id="cIframe"
            class="c_iframe"
            name="cIframe"
            :src="iframeUrl"
            width="100%"
            height="auto"
            frameborder="0"
            v-show="!loading"
          ></iframe>
        </div>
      </div>
    </div>
  </div>
  <!-- 开发环境版本，包含了有帮助的命令行警告 -->
  <script src="plugins/vue/vue.js"></script>
  <!-- 引入组件库 -->
  <script src="plugins/element-ui/index.js"></script>
  <!-- 引入axios -->
  <script src="plugins/axios/axios.min.js"></script>
  <script src="js/request.js"></script>
  <script src="./api/login.js"></script>
  <script>

    new Vue({
      el: '#app',
      data() {
        return {
          defAct: '2',
          menuActived: '2',
          userInfo: {},
          iframeUrl: 'page/member/list.html',
          headTitle: '员工管理',
          goBackFlag: false,
          loading: true,
          timer: null
        }
      },
      computed: {},
      created() {
        const userInfo = window.localStorage.getItem('userInfo')
        if (userInfo) {
          this.userInfo = JSON.parse(userInfo)
        }
        this.closeLoading()
      },
      beforeDestroy() {
        this.timer = null
        clearTimeout(this.timer)
      },
      mounted() {
        window.menuHandle = this.menuHandle
      },
      methods: {
        logout() {
          logoutApi().then((res)=>{
            if(res.code === 1){
              localStorage.removeItem('userInfo')
              window.location.href = '/backend/page/login/login.html'
            }
          })
        },
        goBack() {
          const menu = this.menuList.find(item=>item.id===this.menuActived)
          this.menuHandle(menu,false)
        },
        menuHandle(item, goBackFlag) {
          this.loading = true
          this.menuActived = item.id
          this.iframeUrl = item.url
          this.headTitle = item.name
          this.goBackFlag = goBackFlag
          this.closeLoading()
        },
        closeLoading(){
          this.timer = null
          this.timer = setTimeout(()=>{
            this.loading = false
          },1000)
        }
      }
    })
  </script>
</body>

</html>
