<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
  <title>慢食光</title>
  <link rel="icon" href="./../images/favico.ico">
  <!--不同屏幕尺寸根字体设置-->
  <script src="./../js/base.js"></script>
  <!--element-ui的样式-->
  <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css" />
  <!--引入vant样式-->
  <link rel="stylesheet" href="../styles/vant.min.css" />
  <!-- 引入样式  -->
  <link rel="stylesheet" href="../styles/index.css" />
  <!--本页面内容的样式-->
  <link rel="stylesheet" href="./../styles/login.css" />
</head>

<body>
  <div id="login" v-loading="loading">
    <header class="login-header">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <h1 class="brand-name">慢食光</h1>
      <p class="brand-subtitle">慢下来，享受美食时光</p>
    </header>

    <main class="login-form">
      <div class="form-card">
        <div class="form-group">
          <label class="form-label" for="phone">手机号码</label>
          <div class="input-wrapper">
            <van-field
              v-model="form.phone"
              type="tel"
              maxlength="11"
              placeholder="请输入手机号码"
              clearable
              @input="onPhoneInput" />
          </div>
          <p class="error-msg" v-if="msgFlag">手机号格式不正确，请重新输入</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="code">验证码</label>
          <div class="input-wrapper">
            <van-field
              v-model="form.code"
              type="number"
              maxlength="6"
              placeholder="请输入验证码"
              clearable />
            <button
              class="get-code-btn"
              :class="{ disabled: !canGetCode || sending }"
              @click="getCode"
              :disabled="!canGetCode || sending">
              {{ sending ? '发送中...' : (codeText || '获取验证码') }}
            </button>
          </div>
        </div>

        <van-button
          class="login-btn"
          type="primary"
          :loading="loading"
          :disabled="!canSubmit"
          @click="btnLogin">
          登录 / 注册
        </van-button>
      </div>
    </main>

    <footer class="login-footer">
      <span>© 2024 慢食光 版权所有</span>
    </footer>
  </div>

  <!-- 开发环境版本，包含了有帮助的命令行警告 -->
  <script src="../../backend/plugins/vue/vue.js"></script>
  <!-- 引入组件库 -->
  <script src="../../backend/plugins/element-ui/index.js"></script>
  <!-- 引入vant组件 -->
  <script src="./../js/vant.min.js"></script>
  <!-- 引入axios -->
  <script src="../../backend/plugins/axios/axios.min.js"></script>
  <script src="./../js/request.js"></script>
  <script src="./../api/login.js"></script>

  <script>
    new Vue({
      el: "#login",
      data() {
        return {
          form: {
            phone: '',
            code: ''
          },
          msgFlag: false,
          loading: false,
          sending: false,
          countdown: 0,
          codeTimer: null
        }
      },
      computed: {
        canGetCode() {
          const regex = /^1[3-9]\d{9}$/;
          return regex.test(this.form.phone) && this.countdown === 0 && !this.sending;
        },
        canSubmit() {
          const regex = /^1[3-9]\d{9}$/;
          return regex.test(this.form.phone) && this.form.code.length >= 4 && !this.loading;
        },
        codeText() {
          if (this.countdown > 0) {
            return this.countdown + 's后重发';
          }
          return '';
        }
      },
      created() {},
      mounted() {},
      beforeDestroy() {
        if (this.codeTimer) {
          clearInterval(this.codeTimer);
        }
      },
      methods: {
        onPhoneInput() {
          this.msgFlag = false;
        },
        getCode() {
          if (!this.canGetCode) return;

          this.sending = true;
          this.form.code = '';

          sendCodeApi({ phone: this.form.phone }).then(res => {
            this.sending = false;
            if (res.code === 1) {
              this.startCountdown();
              this.$notify({ type: 'success', message: '验证码已发送（开发模式：控制台查看）' });
              console.log('验证码已发送'); // 开发模式下返回验证码
            } else {
              this.$notify({ type: 'warning', message: res.msg });
            }
          }).catch(() => {
            this.sending = false;
            this.$notify({ type: 'warning', message: '发送失败，请重试' });
          });
        },
        startCountdown() {
          this.countdown = 60;
          this.codeTimer = setInterval(() => {
            this.countdown--;
            if (this.countdown <= 0) {
              clearInterval(this.codeTimer);
              this.countdown = 0;
            }
          }, 1000);
        },
        async btnLogin() {
          if (!this.canSubmit) return;

          this.loading = true;
          const res = await loginApi({ phone: this.form.phone, code: this.form.code });
          this.loading = false;

          if (res.code === 1) {
            sessionStorage.setItem("userPhone", this.form.phone);
            sessionStorage.setItem("userInfo", JSON.stringify(res.data));
            window.requestAnimationFrame(() => {
              window.location.href = '/front/index.html';
            });
          } else {
            this.$notify({ type: 'warning', message: res.msg });
          }
        }
      }
    });
  </script>
</body>

</html>
